name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # peers are optional (host-injected at runtime); install them explicitly for tests
      - run: npm install --no-save --legacy-peer-deps @deepseek-ai/cordis@^4.0.1 @deepseek-ai/schemastery@^3.18.1 @deepseek-ai/dsh-tools@0.1.1-rc.2 @deepseek-ai/dsh-llm@0.1.1-rc.2
      - run: npm test
