- insert:
    - id: project-memory
      name: "@yolk_vat-y/dsh-project-memory"
      config:
        memoryDir: .dsh-project-memory
        chunkChars: 3000
        maxChunksPerFile: 40
        llmQueryExpansion: false
        expansionCount: 6
        lazyIndexing: true
        autoIndexOnFirstUse: false
        watch: true
        watchInterval: 30
        # 危险根护栏（家目录 / 文件系统根 / 系统与包管理器前缀整体扫描会吃满内存）。
        # 懒索引/会话审计/任务桥永不越权；true 放开**显式**带 root 的工具调用，也放行 autoIndexOnFirstUse。
        allowUnsafeRoots: false
        # 单次扫描上限；截断会报告，且不会删除未扫到的条目。
        maxScanFiles: 20000
        maxScanDepth: 12