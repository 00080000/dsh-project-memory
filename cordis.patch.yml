- insert:
    - id: project-memory
      name: "@yolk_vat-y/dsh-project-memory"
      config:
        memoryDir: .dsh-project-memory
        chunkChars: 3000
        maxChunksPerFile: 40
        llmQueryExpansion: false
        expansionCount: 6
        lazyIndexing: true
        autoIndexOnFirstUse: false
        watch: true
        watchInterval: 30
        # 危险根护栏（家目录 / 文件系统根 / 系统与包管理器前缀整体扫描会吃满内存）。
        # 兼容开关：只放开内置名单；roots.deny / roots.exclude 仍然优先。
        allowUnsafeRoots: false
        # 自定义根名单（可选；allow/deny 精确匹配目录本身，exclude 是子树前缀）。
        # roots:
        #   allow: []
        #   deny: []
        #   exclude: []
        # 单次扫描上限；截断会报告，且不会删除未扫到的条目。
        maxScanFiles: 20000
        maxScanDepth: 12